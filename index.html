<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Factory Planner Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>净产出计算器</h1>
    <p class="subtitle">按配方添加每分钟执行速率，计算表观产出、消耗与净产出</p>

    <section class="panel">
      <div class="field">
        <label for="recipe_query">配方（可输入搜索并下拉选择）</label>
        <div class="inline_field_row">
          <div class="recipe_combo_box" id="recipe_combo_box">
            <div class="combo_input_row">
              <input id="recipe_query" type="text" placeholder="输入关键字后点击右侧下拉按钮">
              <button id="recipe_dropdown_btn" type="button" class="combo_toggle_btn" aria-label="展开配方列表">▼</button>
            </div>
            <ul id="recipe_dropdown_list" class="recipe_dropdown_list" hidden></ul>
          </div>
          <select id="recipe_match_mode">
            <option value="inputs_only">匹配原料</option>
            <option value="outputs_only">匹配产物</option>
            <option value="inputs_or_outputs" selected>同时匹配原料和产物</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label for="recipe_rate_per_min">该配方执行速率（次/min）</label>
        <input id="recipe_rate_per_min" type="number" min="0" step="0.01" value="10">
      </div>
      <button id="add_entry_btn" type="button">添加</button>
    </section>

    <section class="panel">
      <h2>已添加数据</h2>
      <ul id="entry_list"></ul>
      <button id="calc_btn" type="button">计算</button>
    </section>

    <section class="panel result" id="result_box" aria-live="polite">
      <h2>结果</h2>
      <p id="result_summary">请先添加配方速率，再点击“计算”</p>
      <div class="table_wrap">
        <table id="result_table">
          <thead>
            <tr>
              <th>物品</th>
              <th>表观产出</th>
              <th>总消耗</th>
              <th>净产出</th>
              <th>详情</th>
            </tr>
          </thead>
          <tbody id="result_table_body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="recipe_database.js"></script>
  <script src="app.js"></script>
</body>
</html>
